<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284 200" width="284" height="200" role="img">
<style>:root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;--accent:#e5532d;--soft:#fde3da;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#8d96a0;--accent:#ff7b54;--soft:#3a1f17;}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.t{fill:var(--fg);font-size:17px;font-weight:600}
.d{fill:var(--muted);font-size:12.5px}
.k{fill:var(--accent);font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:11px}
.ac{fill:var(--accent)}.so{fill:var(--soft)}.st{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd{fill:var(--border)}

.b{opacity:0;transform-box:fill-box;animation:bub 5.4s ease-out infinite}
.b1{transform-origin:left bottom}.b2{transform-origin:right bottom;animation-delay:1.1s}.b3{transform-origin:left bottom;animation-delay:2.2s}
@keyframes bub{0%{opacity:0;transform:scale(.6)}6%,84%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style>
<rect x=".5" y=".5" width="283" height="199" rx="12" fill="var(--bg)" stroke="var(--border)"/>
<g class="b b1"><rect x="24" y="22" width="120" height="24" rx="12" style="fill:var(--panel);stroke:var(--border)"/><rect x="38" y="32" width="70" height="4" rx="2" class="bd"/></g>
<g class="b b2"><rect x="124" y="50" width="136" height="24" rx="12" class="ac"/><rect x="138" y="60" width="78" height="4" rx="2" fill="#fff" opacity=".85"/><path d="M228 62l3 3 6-7M235 62l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="b b3"><rect x="24" y="78" width="84" height="22" rx="11" style="fill:var(--panel);stroke:var(--border)"/><rect x="38" y="87" width="44" height="4" rx="2" class="bd"/></g>
<text x="24" y="132" class="t">Eccos</text>
<text x="24" y="153" class="d">Self-hostable WhatsApp Cloud API</text><text x="24" y="170" class="d">gateway. Meta Tech Provider.</text>
<text x="24" y="188" class="k">open source · eccos.chat</text>
</svg>