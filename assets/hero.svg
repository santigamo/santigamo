.fg{fill:var(--fg)}.mu{fill:var(--muted)}.ac{fill:var(--accent)}
.px{fill:var(--fg);opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .3s cubic-bezier(.2,1.5,.4,1) forwards,shim 3.2s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes shim{0%,26%,100%{fill:var(--fg)}10%{fill:var(--accent)}}
.sc{opacity:0;animation:show 9.0s linear infinite}
@keyframes show{0%,32.73%{opacity:1}33.33%,100%{opacity:0}}
.out{opacity:0;animation:out 9.0s linear infinite}
@keyframes out{0%,6.89%{opacity:0}8.67%,100%{opacity:1}}
.o2{animation-name:out2}
@keyframes out2{0%,8.44%{opacity:0}10.22%,100%{opacity:1}}
.cur{animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes ty0{0%{transform:translateX(0);animation-timing-function:steps(6,end)}3.00%,100%{transform:translateX(50.4px)}}
@keyframes ty1{0%{transform:translateX(0);animation-timing-function:steps(8,end)}4.00%,100%{transform:translateX(67.2px)}}
@keyframes ty2{0%{transform:translateX(0);animation-timing-function:steps(13,end)}6.50%,100%{transform:translateX(109.2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.px{opacity:1}.sc:nth-of-type(1),.sc:nth-of-type(1) .out{opacity:1}.sc g{display:none}}</style>
