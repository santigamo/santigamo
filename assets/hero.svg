<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 458" width="880" height="458" role="img" aria-label="I take products from idea to release and keep running them afterwards. A terminal lists work with teams and clients (AIFindr, Oasis, Digital Twins) and my own products (Transcribo, Eccos, Reccado).">
<style>:root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;--accent:#0969da;--soft:#ddf4ff;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#8d96a0;--accent:#4c9aff;--soft:#0f2238;}}
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px}
.h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-size:31px;font-weight:700;letter-spacing:-.4px;fill:var(--fg)}
.fg{fill:var(--fg)}.mu{fill:var(--muted)}.ac{fill:var(--accent)}
.in{opacity:0;animation:rise .35s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dot{fill:var(--border);animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,40%,100%{fill:var(--border)}18%{fill:var(--accent)}}
.cur{animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes sel{0.00%{transform:translateY(0px)}16.67%{transform:translateY(25px)}33.33%{transform:translateY(50px)}50.00%{transform:translateY(109px)}66.67%{transform:translateY(134px)}83.33%{transform:translateY(159px)}}
.sel{opacity:0;animation:rise .3s ease-out 1.26s forwards,sel 9.0s step-end 1.26s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.sel{opacity:1}}</style>
