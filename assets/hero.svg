<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Terminal: whoami prints SANTI, full-stack product engineer in Barcelona">
<style>:root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;--accent:#e5532d;--soft:#fde3da;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#8d96a0;--accent:#ff7b54;--soft:#3a1f17;}}
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}
.fg{fill:var(--fg)}.mu{fill:var(--muted)}.ac{fill:var(--accent)}
.ch{opacity:0;animation:on .01s linear forwards}
.px{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) forwards}
.ln{opacity:0;animation:rise .5s ease-out forwards}
.cur{opacity:0;animation:on .01s linear 3.3s forwards,move .9s steps(9,end) 3.5s forwards,blink 1.1s steps(1) 4.5s infinite}
@keyframes on{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes move{to{transform:translateX(75.6px)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style>
